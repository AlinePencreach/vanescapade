<!doctype html>
<html lang="fr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../van-escapade.css">
<meta charset="utf-8">
<title>Logo</title>
<style>
body { padding: var(--space-lg); background: var(--bg); }

</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-md);max-width:900px">
<div class="ve-card ve-card--flat" style="display:grid;place-items:center;height:140px"><img src="../logos/logo-color.svg" alt="Logo Van Escapade, version couleur" style="height:52px"></div>
<div class="ve-card" style="display:grid;place-items:center;height:140px;background:var(--marine-700)"><img src="../logos/logo-reverse.svg" alt="Logo Van Escapade sur marine" style="height:52px"></div>
<div class="ve-card" style="display:grid;place-items:center;height:140px;background:var(--sable-200)"><img src="../logos/logo-marine.svg" alt="Logo Van Escapade, version marine" style="height:52px"></div>
<div class="ve-card" style="display:grid;place-items:center;height:140px;background:var(--orange-500)"><img src="../logos/logo-white.svg" alt="Logo Van Escapade, version blanche" style="height:52px"></div>
<div class="ve-card ve-card--flat" style="display:grid;place-items:center;gap:var(--space-sm);height:150px"><div style="padding:14px;outline:1.5px dashed var(--border-strong)"><img src="../logos/logo-color.svg" alt="Logo avec sa zone de protection" style="height:52px;display:block"></div><p class="caption muted">Zone de protection = hauteur du « v »</p></div>
<div class="ve-card ve-card--flat" style="display:flex;gap:var(--space-lg);align-items:center;justify-content:center;height:150px"><div style="text-align:center"><img src="../logos/favicon.svg" alt="Favicon" style="height:16px"><p class="caption muted">16 px</p></div><div style="text-align:center"><img src="../logos/favicon.svg" alt="Favicon" style="height:48px"><p class="caption muted">favicon</p></div><div style="text-align:center"><img src="../logos/logo-color.svg" alt="Logo à taille minimale" style="height:20px"><p class="caption muted">20 px minimum</p></div></div>
</div>
</body>
</html>
