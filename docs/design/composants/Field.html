<!doctype html>
<html lang="fr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../van-escapade.css">
<meta charset="utf-8">
<title>Field</title>
<style>
body { padding: var(--space-lg); background: var(--bg); }

</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(2,320px);gap:var(--space-lg)">
<div class="ve-field"><label class="ve-label">Adresse e-mail</label><div class="ve-input"><svg class="ve-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span class="ph">prenom.nom@mail.fr</span></div><p class="ve-help">Elle sert d'identifiant de connexion.</p></div>
<div class="ve-field"><label class="ve-label">Date de départ</label><div class="ve-input is-focus"><svg class="ve-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg><span>12/07/2027</span></div><p class="ve-help">Retrait de 9 h à 12 h ou de 14 h à 18 h.</p></div>
<div class="ve-field"><label class="ve-label">Mot de passe</label><div class="ve-input is-error"><svg class="ve-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>••••••••</span></div><p class="ve-error"><svg class="ve-icon ve-icon--16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>10 caractères minimum, dont 1 majuscule, 1 chiffre et 1 caractère spécial.</p></div>
<div class="ve-field"><label class="ve-label">Van choisi <span class="opt">(non modifiable)</span></label><div class="ve-input is-disabled"><svg class="ve-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg><span>Le Ventoux</span></div><p class="ve-help">Pour changer de van, annulez puis refaites une réservation.</p></div>
</div>
</body>
</html>
