<!doctype html>
<html lang="fr">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../van-escapade.css">
<meta charset="utf-8">
<title>Filters</title>
<style>
body { padding: var(--space-lg); background: var(--bg); }

</style>
</head>
<body>
<div style="display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:var(--space-xl);max-width:980px">
<div style="display:grid;gap:var(--space-md);align-content:start"><p class="ve-label">Catégorie</p><div style="display:flex;flex-wrap:wrap;gap:var(--space-sm)"><button class="ve-chip is-on" aria-pressed="true"><svg class="ve-icon ve-icon--16" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Fourgon aménagé</button><button class="ve-chip" aria-pressed="false">Van compact</button><button class="ve-chip" aria-pressed="false">Camping-car profilé</button></div>
<p class="ve-label">Prix par jour</p><div class="ve-range"><span class="ve-range__track"></span><span class="ve-range__fill" style="left:15%;right:30%"></span><span class="ve-range__thumb" style="left:15%"></span><span class="ve-range__thumb" style="left:70%"></span></div><div class="ve-range__values"><span>min 75 €</span><span>max 110 €</span></div></div>
<div style="display:grid;gap:var(--space-xs);align-content:start"><p class="ve-label" style="margin-bottom:var(--space-xs)">Équipements</p>
<label class="ve-check"><span class="ve-check__box is-on"><svg class="ve-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Douche<span class="count">3</span></label>
<label class="ve-check"><span class="ve-check__box"></span>WC chimique<span class="count">4</span></label>
<label class="ve-check"><span class="ve-check__box is-on"><svg class="ve-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>Chauffage stationnaire<span class="count">5</span></label>
<label class="ve-check"><span class="ve-check__box"></span>Panneau solaire<span class="count">2</span></label></div>
<div style="display:grid;gap:var(--space-xs);align-content:start"><p class="ve-label" style="margin-bottom:var(--space-xs)">Boîte de vitesses</p>
<label class="ve-check"><span class="ve-check__box ve-radio"></span>Indifférent</label>
<label class="ve-check"><span class="ve-check__box ve-radio"></span>Manuelle</label>
<label class="ve-check"><span class="ve-check__box ve-radio is-on"></span>Automatique</label></div>
</div>
</body>
</html>
